# Gradle properties — KnowledgeBunker (black & white terminal, JetBrains Mono)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Kotlin code style
kotlin.code.style=official
# Android placeholder — SDK not required for desktop/web builds
android.useAndroidX=true
android.nonTransitiveRDependency=true
# Compose
org.jetbrains.compose.experimental.uikit.enabled=false
